<!DOCTYPE html>
<html lang="en" class="h-full select-none">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CloudOS — Web Desktop</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Google Identity Services & API Client -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="https://apis.google.com/js/api.js" async defer></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eef2ff',
              100: '#e0e7ff',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
              900: '#312e81'
            }
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'Segoe UI', 'Roboto', 'sans-serif'],
            mono: ['Fira Code', 'Courier New', 'monospace']
          }
        }
      }
    }
  </script>

  <style>
    /* Custom UI Scrollbars */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.4);
    }
    
    /* Acrylic Glass Effects */
    .acrylic {
      background: rgba(18, 24, 38, 0.72);
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.12);
    }
    .acrylic-light {
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.35);
    }
    .acrylic-card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(12px);
    }

    /* Window Resize Handles */
    .resize-handle {
      position: absolute;
      z-index: 50;
    }
    .resize-right { top: 0; right: -4px; width: 8px; height: 100%; cursor: ew-resize; }
    .resize-bottom { bottom: -4px; left: 0; width: 100%; height: 8px; cursor: ns-resize; }
    .resize-corner { bottom: -4px; right: -4px; width: 14px; height: 14px; cursor: nwse-resize; }

    /* Selection Box */
    #selection-box {
      border: 1px solid rgba(99, 102, 241, 0.7);
      background-color: rgba(99, 102, 241, 0.18);
      position: absolute;
      pointer-events: none;
      z-index: 10;
      border-radius: 4px;
    }

    /* Pulse animation for sync */
    @keyframes pulseGlow {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(1.15); }
    }
    .sync-glow {
      animation: pulseGlow 2s infinite ease-in-out;
    }
  </style>
</head>

<body class="h-full w-full overflow-hidden bg-slate-950 text-slate-100 font-sans relative antialiased selection:bg-indigo-500 selection:text-white">

  <div id="desktop-wallpaper" class="absolute inset-0 bg-cover bg-center transition-all duration-700 -z-10 brightness-[0.88]"
       style="background-image: url('https://images.unsplash.com/photo-1579546929518-9e396f3cc809?q=80&w=2070&auto=format&fit=crop');">
  </div>

  <div id="desktop-area" class="relative w-full h-[calc(100%-48px)] overflow-hidden p-4" oncontextmenu="Desktop.openContextMenu(event); return false;">
    
    <!-- Desktop Icons Grid -->
    <div id="desktop-icons-container" class="grid grid-flow-col grid-rows-6 gap-3 w-fit h-full content-start select-none">
      <!-- Icons are dynamically populated by JS -->
    </div>

    <!-- Windows Workspace Canvas -->
    <div id="windows-container" class="absolute inset-0 pointer-events-none z-20">
      <!-- Window DOM nodes injected dynamically here -->
    </div>

    <!-- Marquee selection marquee rect -->
    <div id="selection-box" class="hidden"></div>
  </div>

  <footer id="taskbar" class="absolute bottom-0 left-0 right-0 h-12 acrylic border-t border-white/10 z-50 flex items-center justify-between px-3">
    <!-- Left: Start button & Pinned apps -->

        <i data-lucide="layout-grid" class="w-5 h-5"></i>
      </button>
      
      <!-- Quick Search Icon / Bar -->
      <button onclick="Desktop.toggleStartMenu(true)" class="flex items-center space-x-2 px-3 h-8 rounded-lg bg-white/5 hover:bg-white/10 text-xs text-slate-300 border border-white/5 transition">
        <i data-lucide="search" class="w-3.5 h-3.5 text-slate-400"></i>
        <span class="hidden sm:inline">Search Drive & apps...</span>
      </button>

      <div class="h-5 w-[1px] bg-white/15 mx-1 hidden sm:block"></div>

      <!-- Pinned & Running Taskbar Icons -->

    <!-- Right: System Tray (Drive Sync, Sound, Battery, Clock) -->

        <i data-lucide="wifi" class="w-4 h-4 text-emerald-400"></i>
      </div>

      <!-- Sound Control Popover trigger -->

        <button onclick="Desktop.toggleTrayVolume()" class="p-1.5 hover:bg-white/10 rounded-lg transition" title="Volume Controls">
          <i data-lucide="volume-2" class="w-4 h-4 text-slate-300"></i>

  <!-- Desktop Right-Click Context Menu -->

      <button onclick="DriveStorage.createNewItemPrompt('file'); Desktop.closeContextMenu();" class="flex items-center space-x-2.5 w-full px-3 py-1.5 hover:bg-white/10 text-left text-slate-200">

    <div class="py-1">

  <!-- Hidden Custom Modal Container (Safe Alert replacement) -->

      <div class="flex justify-end space-x-2.5">

        <button id="modal-confirm-btn" class="px-4 py-1.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-xs font-medium text-white shadow-lg transition">Confirm</button>
      </div>
    </div>
  </div>

  <script>
    /* CloudOS Sound Effects (ToneJS-less synthesized Web Audio API for zero latency and zero dependency) */
    const SoundEngine = {
      ctx: null,
      volume: 0.8,
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) this.ctx = new AudioContext();
        }
      },
      setVolume(val) {
        this.volume = val / 100;
      },
      playTone(freq, type = 'sine', duration = 0.08) {
        try {
          this.init();
          if (!this.ctx) return;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
          gain.gain.setValueAtTime(this.volume * 0.15, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + duration);
        } catch (e) {
          // Audio context safe fallback
        }
      },
      click() { this.playTone(800, 'triangle', 0.04); },
      open() { this.playTone(550, 'sine', 0.1); },
      action() { this.playTone(1050, 'sine', 0.12); },
      notify() {
        this.playTone(520, 'sine', 0.08);
        setTimeout(() => this.playTone(880, 'sine', 0.15), 90);
      }
    };

    /* Notification Center */
    const Notifications = {
      show(title, message, type = 'info') {
        SoundEngine.notify();
        const container = document.getElementById('notification-center');
        const toast = document.createElement('div');
        toast.className = 'acrylic pointer-events-auto rounded-xl p-3 border border-white/15 shadow-2xl flex items-start space-x-3 w-80 transform translate-x-10 opacity-0 transition-all duration-300';
        
        let iconName = 'info';
        let iconColor = 'text-indigo-400';
        if (type === 'success') { iconName = 'check-circle-2'; iconColor = 'text-emerald-400'; }
        if (type === 'warn') { iconName = 'alert-triangle'; iconColor = 'text-amber-400'; }
        if (type === 'error') { iconName = 'alert-octagon'; iconColor = 'text-red-400'; }

        toast.innerHTML = `
          <div class="mt-0.5 ${iconColor} flex-shrink-0">
            <i data-lucide="${iconName}" class="w-4 h-4"></i>
          </div>
          <div class="flex-1">
            <h5 class="text-xs font-semibold text-white">${title}</h5>
            <p class="text-[11px] text-slate-300 leading-snug">${message}</p>
          </div>
          <button class="text-slate-400 hover:text-white" onclick="this.parentElement.remove()">
            <i data-lucide="x" class="w-3.5 h-3.5"></i>
          </button>
        `;
        container.appendChild(toast);
        lucide.createIcons();
        setTimeout(() => {
          toast.classList.remove('translate-x-10', 'opacity-0');
        }, 10);
        setTimeout(() => {
          toast.classList.add('translate-x-10', 'opacity-0');
          setTimeout(() => toast.remove(), 300);
        }, 4500);
      }
    };

    /* Dialog Box Utility (No alert/confirm) */
    const SystemDialog = {
      show({ title, message, prompt = false, defaultValue = '', icon = 'info', onConfirm, onCancel }) {
        const modal = document.getElementById('system-modal');
        const titleEl = document.getElementById('modal-title');
        const msgEl = document.getElementById('modal-message');
        const promptWrap = document.getElementById('modal-prompt-wrap');
        const promptInput = document.getElementById('modal-prompt-input');
        const confirmBtn = document.getElementById('modal-confirm-btn');
        const cancelBtn = document.getElementById('modal-cancel-btn');

        titleEl.textContent = title || 'Notice';
        msgEl.textContent = message || '';

        if (prompt) {
          promptWrap.classList.remove('hidden');
          promptInput.value = defaultValue;
          setTimeout(() => promptInput.focus(), 50);
        } else {
          promptWrap.classList.add('hidden');
        }

        modal.classList.remove('hidden');

        const cleanUp = () => {
          modal.classList.add('hidden');
          confirmBtn.onclick = null;
          cancelBtn.onclick = null;
        };

        confirmBtn.onclick = () => {
          const val = prompt ? promptInput.value : true;
          cleanUp();
          if (onConfirm) onConfirm(val);
        };

        cancelBtn.onclick = () => {
          cleanUp();
          if (onCancel) onCancel();
        };
      }
    };
  </script>

  <script>
    /**
     * Storage Engine: Operates entirely in runtime memory or direct Google Drive API v3.
     * ZERO data stored in localStorage/IndexedDB without explicit ephemeral permission.
     */
    const DriveStorage = {
      mode: 'virtual', // 'virtual' | 'gdrive'
      clientId: '',
      apiKey: '',
      accessToken: null,
      tokenClient: null,
      userProfile: null,
      
      // Virtual In-Memory Drive structure (Pre-loaded with sample files & folders)
      virtualFileSystem: [
        { id: 'f-root-1', name: 'Cloud Documents', type: 'folder', parent: 'root', modifiedTime: '2026-09-18T10:00:00Z', size: '--' },
        { id: 'f-root-2', name: 'Media Library', type: 'folder', parent: 'root', modifiedTime: '2026-09-17T15:20:00Z', size: '--' },
        { id: 'doc-1', name: 'Welcome_To_CloudOS.txt', type: 'text/plain', parent: 'root', modifiedTime: '2026-09-19T08:00:00Z', size: '1.2 KB', content: `Welcome to CloudOS!\n====================\n\n1. 100% Client-Side Web Desktop: Perfect for hosting on GitHub Pages.\n2. Google Drive Storage: Seamlessly connects directly to Google Drive API v3 using Google Identity Services (GIS).\n3. Privacy First: Files reside in your Google Drive cloud space, not locally stored in cookies or permanent device storage.\n4. Virtual Cloud Mode: Works immediately out-of-the-box in volatile memory if you do not want to configure Google API keys yet.\n\nEnjoy exploring the apps!\n` },
        { id: 'doc-2', name: 'System_Specs.json', type: 'application/json', parent: 'root', modifiedTime: '2026-09-19T09:12:00Z', size: '340 B', content: `{\n  "os": "CloudOS v3.2",\n  "storageTarget": "Google Drive REST v3",\n  "platform": "Vanilla Web / GitHub Pages",\n  "security": "Ephemeral Runtime Memory"\n}` },
        { id: 'doc-3', name: 'Project_Roadmap.md', type: 'text/markdown', parent: 'f-root-1', modifiedTime: '2026-09-18T11:45:00Z', size: '820 B', content: `# Roadmap\n- [x] Window drag & snap\n- [x] Start menu & System tray\n- [x] Google Drive API v3 streaming\n- [x] Web Terminal & Neofetch\n- [x] In-browser sandboxed tools` },
        { id: 'media-1', name: 'Sample_Landscape.jpg', type: 'image/jpeg', parent: 'f-root-2', modifiedTime: '2026-09-15T14:30:00Z', size: '280 KB', url: 'https://images.unsplash.com/photo-1506744038136-46273834b3fb?w=800' }
      ],

      currentFolderId: 'root',

      init() {
        this.updateTrayBadge();
      },

      updateTrayBadge() {
        const text = document.getElementById('tray-cloud-text');
        const icon = document.getElementById('tray-cloud-icon');
        const startName = document.getElementById('start-drive-name');
        const startStatus = document.getElementById('start-drive-status');

        if (this.mode === 'gdrive' && this.accessToken) {
          text.textContent = 'Drive: Connected';
          text.className = 'hidden md:inline text-[11px] font-medium text-emerald-300';
          icon.className = 'w-4 h-4 text-emerald-400 sync-glow';
          startName.textContent = this.userProfile ? this.userProfile.name : 'Google Drive';
          startStatus.textContent = 'Live Cloud v3 Active';
        } else {
          text.textContent = 'Drive: Virtual';
          text.className = 'hidden md:inline text-[11px] font-medium text-amber-300';
          icon.className = 'w-4 h-4 text-amber-400';
          startName.textContent = 'Virtual Cloud Storage';
          startStatus.textContent = 'Mode: Ephemeral RAM';
        }
      },

      openAuthDialog() {
        AppManager.launch('settings', { tab: 'drive' });
      },

      /* Initialize Google Identity Services */
      initGoogleDriveAuth(clientId, apiKey, callback) {
        if (!clientId || !apiKey) {
          Notifications.show('Drive Configuration', 'Please specify both Client ID and API Key.', 'warn');
          return;
        }
        this.clientId = clientId;
        this.apiKey = apiKey;

        try {
          if (!window.google || !google.accounts) {
            Notifications.show('Drive Error', 'Google Identity Services script not yet ready. Check network connection.', 'error');
            return;
          }

          this.tokenClient = google.accounts.oauth2.initTokenClient({
            client_id: this.clientId,
            scope: 'https://www.googleapis.com/auth/drive.file https://www.googleapis.com/auth/userinfo.profile',
            callback: (tokenResponse) => {
              if (tokenResponse && tokenResponse.access_token) {
                this.accessToken = tokenResponse.access_token;
                this.mode = 'gdrive';
                this.fetchUserProfile();
                this.updateTrayBadge();
                Notifications.show('Drive Connected', 'Successfully authenticated with Google Drive!', 'success');
                if (callback) callback(true);
                DriveExplorer.refresh();
              }
            },
          });

          this.tokenClient.requestAccessToken({ prompt: 'consent' });
        } catch (err) {
          console.error(err);
          Notifications.show('OAuth Error', err.message || 'Failed initializing GIS Client', 'error');
        }
      },

      async fetchUserProfile() {
        try {
          const res = await fetch('https://www.googleapis.com/oauth2/v2/userinfo', {
            headers: { Authorization: `Bearer ${this.accessToken}` }
          });
          const data = await res.json();
          this.userProfile = data;
          if (data.name) {
            document.getElementById('start-user-name').textContent = data.name;
            document.getElementById('start-user-sub').textContent = data.email || 'Connected Google Drive';
            if (data.picture) {
              document.getElementById('user-avatar-badge').innerHTML = `<img src="${data.picture}" class="w-full h-full rounded-full object-cover">`;
            }
          }
        } catch (e) {
          console.warn('Could not fetch user profile', e);
        }
      },

      disconnectDrive() {
        this.accessToken = null;
        this.mode = 'virtual';
        this.userProfile = null;
        this.updateTrayBadge();
        document.getElementById('start-user-name').textContent = 'Drive Cloud User';
        document.getElementById('start-user-sub').textContent = 'No local data saved';
        document.getElementById('user-avatar-badge').innerHTML = `<i data-lucide="user" class="w-5 h-5"></i>`;
        lucide.createIcons();
        Notifications.show('Drive Disconnected', 'Switched back to In-Memory Virtual Cloud.', 'info');
        DriveExplorer.refresh();
      },

      /* Unified API: List Files in folder */
      async listFiles(folderId = 'root') {
        if (this.mode === 'gdrive' && this.accessToken) {
          try {
            const query = `'${folderId}' in parents and trashed = false`;
            const fields = 'files(id, name, mimeType, size, modifiedTime, thumbnailLink, webViewLink)';
            const url = `https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent(query)}&fields=${encodeURIComponent(fields)}&key=${this.apiKey}`;
            
            const res = await fetch(url, {
              headers: { Authorization: `Bearer ${this.accessToken}` }
            });
            if (!res.ok) throw new Error(`Drive API error: ${res.statusText}`);
            const data = await res.json();
            
            return (data.files || []).map(f => ({
              id: f.id,
              name: f.name,
              type: f.mimeType === 'application/vnd.google-apps.folder' ? 'folder' : f.mimeType,
              parent: folderId,
              modifiedTime: f.modifiedTime,
              size: f.size ? `${(f.size / 1024).toFixed(1)} KB` : '--',
              webViewLink: f.webViewLink
            }));
          } catch (err) {
            Notifications.show('Cloud Fetch Failed', err.message, 'error');
            return [];
          }
        } else {
          // Return from runtime virtual RAM storage
          return this.virtualFileSystem.filter(item => item.parent === folderId);
        }
      },

      /* Unified API: Get text content of a file */
      async readFile(fileId) {
        if (this.mode === 'gdrive' && this.accessToken) {
          try {
            const res = await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`, {
              headers: { Authorization: `Bearer ${this.accessToken}` }
            });
            return await res.text();
          } catch (e) {
            Notifications.show('Error', 'Unable to read file from Drive', 'error');
            return '';
          }
        } else {
          const item = this.virtualFileSystem.find(f => f.id === fileId);
          return item ? (item.content || '') : '';
        }
      },

      /* Unified API: Save / Write file */
      async writeFile(name, content, fileId = null, parentId = 'root') {
        if (this.mode === 'gdrive' && this.accessToken) {
          try {
            if (fileId) {
              // Update existing
              const res = await fetch(`https://www.googleapis.com/upload/drive/v3/files/${fileId}?uploadType=media`, {
                method: 'PATCH',
                headers: {
                  Authorization: `Bearer ${this.accessToken}`,
                  'Content-Type': 'text/plain'
                },
                body: content
              });
              if (res.ok) {
                Notifications.show('Saved', `${name} updated in Google Drive`, 'success');
                return true;
              }
            } else {
              // Create new multipart upload
              const metadata = { name: name, parents: [parentId === 'root' ? 'root' : parentId] };
              const boundary = 'foo_bar_baz';
              const delimiter = "\r\n--" + boundary + "\r\n";
              const close_delim = "\r\n--" + boundary + "--";

              const multipartRequestBody =
                delimiter +
                'Content-Type: application/json; charset=UTF-8\r\n\r\n' +
                JSON.stringify(metadata) +
                delimiter +
                'Content-Type: text/plain\r\n\r\n' +
                content +
                close_delim;

              const res = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart', {
                method: 'POST',
                headers: {
                  Authorization: `Bearer ${this.accessToken}`,
                  'Content-Type': `multipart/related; boundary=${boundary}`
                },
                body: multipartRequestBody
              });
              if (res.ok) {
                Notifications.show('Created', `${name} uploaded to Google Drive`, 'success');
                DriveExplorer.refresh();
                return true;
              }
            }
          } catch (err) {
            Notifications.show('Save Failed', err.message, 'error');
            return false;
          }
        } else {
          // Virtual Memory write
          if (fileId) {
            const item = this.virtualFileSystem.find(f => f.id === fileId);
            if (item) {
              item.content = content;
              item.modifiedTime = new Date().toISOString();
              Notifications.show('Saved', `${name} saved to Virtual Cloud`, 'success');
              return true;
            }
          } else {
            const newId = 'file-' + Date.now();
            this.virtualFileSystem.push({
              id: newId,
              name,
              type: 'text/plain',
              parent: parentId,
              modifiedTime: new Date().toISOString(),
              size: `${(new Blob([content]).size / 1024).toFixed(1)} KB`,
              content
            });
            Notifications.show('Created', `${name} created in memory`, 'success');
            DriveExplorer.refresh();
            return true;
          }
        }
      },

      /* Unified API: Create Folder */
      async createFolder(folderName, parentId = 'root') {
        if (this.mode === 'gdrive' && this.accessToken) {
          try {
            const res = await fetch('https://www.googleapis.com/drive/v3/files', {
              method: 'POST',
              headers: {
                Authorization: `Bearer ${this.accessToken}`,
                'Content-Type': 'application/json'
              },
              body: JSON.stringify({
                name: folderName,
                mimeType: 'application/vnd.google-apps.folder',
                parents: [parentId === 'root' ? 'root' : parentId]
              })
            });
            if (res.ok) {
              Notifications.show('Folder Created', `${folderName} added to Drive`, 'success');
              DriveExplorer.refresh();
            }
          } catch (e) {
            Notifications.show('Error', 'Failed to create folder on Drive', 'error');
          }
        } else {
          const newFolder = {
            id: 'folder-' + Date.now(),
            name: folderName,
            type: 'folder',
            parent: parentId,
            modifiedTime: new Date().toISOString(),
            size: '--'
          };
          this.virtualFileSystem.push(newFolder);
          Notifications.show('Folder Created', `${folderName} added in Virtual Cloud`, 'success');
          DriveExplorer.refresh();
        }
      },

      /* Unified API: Delete File/Folder */
      async deleteItem(id, name) {
        SystemDialog.show({
          title: 'Delete Item',
          message: `Are you sure you want to delete "${name}" from cloud storage?`,
          icon: 'alert-triangle',
          onConfirm: async () => {
            if (DriveStorage.mode === 'gdrive' && DriveStorage.accessToken) {
              try {
                const res = await fetch(`https://www.googleapis.com/drive/v3/files/${id}`, {
                  method: 'DELETE',
                  headers: { Authorization: `Bearer ${DriveStorage.accessToken}` }
                });
                if (res.ok) {
                  Notifications.show('Deleted', `${name} removed from Google Drive`, 'success');
                  DriveExplorer.refresh();
                }
              } catch (e) {
                Notifications.show('Delete Failed', e.message, 'error');
              }
            } else {
              DriveStorage.virtualFileSystem = DriveStorage.virtualFileSystem.filter(f => f.id !== id && f.parent !== id);
              Notifications.show('Deleted', `${name} removed from memory`, 'info');
              DriveExplorer.refresh();
            }
          }
        });
      },

      triggerFileUpload() {
        document.getElementById('global-cloud-file-input').click();
      },

      async handleNativeFileInput(e) {
        const files = Array.from(e.target.files);
        if (!files.length) return;

        for (const file of files) {
          const reader = new FileReader();
          reader.onload = async (event) => {
            const content = event.target.result;
            if (file.type.startsWith('image/')) {
              // Store as virtual url or binary
              DriveStorage.virtualFileSystem.push({
                id: 'upload-' + Date.now(),
                name: file.name,
                type: file.type,
                parent: DriveExplorer.currentPathId,
                modifiedTime: new Date().toISOString(),
                size: `${(file.size / 1024).toFixed(1)} KB`,
                url: content
              });
            } else {
              await DriveStorage.writeFile(file.name, content, null, DriveExplorer.currentPathId);
            }
            Notifications.show('File Uploaded', `${file.name} sent to current directory`, 'success');
            DriveExplorer.refresh();
          };

          if (file.type.startsWith('image/')) {
            reader.readAsDataURL(file);
          } else {
            reader.readAsText(file);
          }
        }
        e.target.value = '';
      },

      createNewItemPrompt(type) {
        SystemDialog.show({
          title: type === 'folder' ? 'New Drive Folder' : 'New Document',
          message: `Enter name for the new ${type}:`,
          prompt: true,
          defaultValue: type === 'folder' ? 'New Folder' : 'Untitled.txt',
          onConfirm: (val) => {
            if (!val) return;
            if (type === 'folder') {
              this.createFolder(val, DriveExplorer.currentPathId);
            } else {
              this.writeFile(val, '# New Cloud Note\nStart typing...', null, DriveExplorer.currentPathId);
            }
          }
        });
      },

      syncRefresh() {
        Notifications.show('Synchronizing', 'Refreshing Cloud file listing...', 'info');
        DriveExplorer.refresh();
      }
    };
  </script>

  <script>
    /**
     * Window Manager handles dragging, resizing, z-index ordering,
     * maximize/restore, minimize, and taskbar integration.
     */
    const WindowManager = {
      windows: {},
      activeWindowId: null,
      topZ: 100,

      create({ id, title, icon = 'app-window', width = 680, height = 480, contentHtml, onInit }) {
        if (this.windows[id]) {
          this.focus(id);
          this.restore(id);
          return;
        }

        const winId = `win-${id}`;
        const winEl = document.createElement('div');
        winEl.id = winId;
        winEl.className = 'window-instance pointer-events-auto absolute acrylic rounded-2xl shadow-2xl border border-white/20 flex flex-col overflow-hidden transition-opacity duration-150';
        
        // Center window on screen initially
        const screenW = window.innerWidth;
        const screenH = window.innerHeight - 48;
        const left = Math.max(20, Math.floor((screenW - width) / 2 + (Object.keys(this.windows).length * 20)));
        const top = Math.max(20, Math.floor((screenH - height) / 2 + (Object.keys(this.windows).length * 20)));

        winEl.style.width = `${width}px`;
        winEl.style.height = `${height}px`;
        winEl.style.left = `${left}px`;
        winEl.style.top = `${top}px`;
        winEl.style.zIndex = ++this.topZ;

        winEl.innerHTML = `
          <!-- Window Titlebar -->
          <div class="window-titlebar h-10 bg-white/5 border-b border-white/10 flex items-center justify-between px-3.5 select-none cursor-move">
            <div class="flex items-center space-x-2 text-xs font-medium text-slate-200 truncate">
              <i data-lucide="${icon}" class="w-4 h-4 text-indigo-400"></i>
              <span class="truncate window-title-text">${title}</span>
            </div>
            <div class="flex items-center space-x-2">
              <button class="win-min-btn w-3 h-3 rounded-full bg-amber-400/80 hover:bg-amber-400 flex items-center justify-center text-black/70 transition"></button>
              <button class="win-max-btn w-3 h-3 rounded-full bg-emerald-400/80 hover:bg-emerald-400 flex items-center justify-center text-black/70 transition"></button>
              <button class="win-close-btn w-3 h-3 rounded-full bg-red-400/80 hover:bg-red-400 flex items-center justify-center text-black/70 transition"></button>
            </div>
          </div>

          <!-- Window Content Body -->
          <div class="window-content flex-1 overflow-hidden relative flex flex-col bg-slate-950/40">
            ${contentHtml}
          </div>

          <!-- Resizers -->
          <div class="resize-handle resize-right"></div>
          <div class="resize-handle resize-bottom"></div>
          <div class="resize-handle resize-corner"></div>
        `;

        document.getElementById('windows-container').appendChild(winEl);
        lucide.createIcons();

        const winData = {
          id,
          element: winEl,
          title,
          icon,
          isMaximized: false,
          isMinimized: false,
          bounds: { left, top, width, height }
        };

        this.windows[id] = winData;
        this.bindEvents(winData);
        this.addTaskbarItem(winData);
        this.focus(id);
        SoundEngine.open();

        if (onInit) onInit(winEl);
      },

      bindEvents(win) {
        const el = win.element;
        const titlebar = el.querySelector('.window-titlebar');
        const minBtn = el.querySelector('.win-min-btn');
        const maxBtn = el.querySelector('.win-max-btn');
        const closeBtn = el.querySelector('.win-close-btn');

        el.addEventListener('mousedown', () => this.focus(win.id));

        // Dragging Logic
        let isDragging = false;
        let startX, startY, origLeft, origTop;

        titlebar.addEventListener('mousedown', (e) => {
          if (e.target.closest('button')) return;
          if (win.isMaximized) return;
          isDragging = true;
          startX = e.clientX;
          startY = e.clientY;
          origLeft = el.offsetLeft;
          origTop = el.offsetTop;

          const onMouseMove = (moveEvent) => {
            if (!isDragging) return;
            const deltaX = moveEvent.clientX - startX;
            const deltaY = moveEvent.clientY - startY;
            el.style.left = `${Math.max(0, origLeft + deltaX)}px`;
            el.style.top = `${Math.max(0, origTop + deltaY)}px`;
          };

          const onMouseUp = () => {
            isDragging = false;
            window.removeEventListener('mousemove', onMouseMove);
            window.removeEventListener('mouseup', onMouseUp);
          };

          window.addEventListener('mousemove', onMouseMove);
          window.addEventListener('mouseup', onMouseUp);
        });

        // Double click titlebar to maximize
        titlebar.addEventListener('dblclick', (e) => {
          if (!e.target.closest('button')) this.toggleMaximize(win.id);
        });

        // Window Controls
        minBtn.onclick = () => this.minimize(win.id);
        maxBtn.onclick = () => this.toggleMaximize(win.id);
        closeBtn.onclick = () => this.close(win.id);

        // Resizing Logic
        const cornerHandle = el.querySelector('.resize-corner');
        const rightHandle = el.querySelector('.resize-right');
        const bottomHandle = el.querySelector('.resize-bottom');

        const setupResize = (handle, resizeW, resizeH) => {
          handle.addEventListener('mousedown', (e) => {
            e.preventDefault();
            e.stopPropagation();
            const startW = el.offsetWidth;
            const startH = el.offsetHeight;
            const startMouseX = e.clientX;
            const startMouseY = e.clientY;

            const onMouseMove = (me) => {
              if (resizeW) {
                const newW = Math.max(340, startW + (me.clientX - startMouseX));
                el.style.width = `${newW}px`;
              }
              if (resizeH) {
                const newH = Math.max(220, startH + (me.clientY - startMouseY));
                el.style.height = `${newH}px`;
              }
            };
            const onMouseUp = () => {
              window.removeEventListener('mousemove', onMouseMove);
              window.removeEventListener('mouseup', onMouseUp);
            };
            window.addEventListener('mousemove', onMouseMove);
            window.addEventListener('mouseup', onMouseUp);
          });
        };

        setupResize(cornerHandle, true, true);
        setupResize(rightHandle, true, false);
        setupResize(bottomHandle, false, true);
      },

      focus(id) {
        const win = this.windows[id];
        if (!win) return;
        this.activeWindowId = id;
        win.element.style.zIndex = ++this.topZ;
        
        // Update taskbar active styling
        document.querySelectorAll('.taskbar-app-item').forEach(btn => {
          btn.classList.remove('bg-white/20', 'border-indigo-400/50');
        });
        const taskBtn = document.getElementById(`task-btn-${id}`);
        if (taskBtn) {
          taskBtn.classList.add('bg-white/20', 'border-indigo-400/50');
        }
      },

      toggleMaximize(id) {
        const win = this.windows[id];
        if (!win) return;
        const el = win.element;
        if (!win.isMaximized) {
          win.bounds = {
            left: el.offsetLeft,
            top: el.offsetTop,
            width: el.offsetWidth,
            height: el.offsetHeight
          };
          el.style.left = '0px';
          el.style.top = '0px';
          el.style.width = '100%';
          el.style.height = 'calc(100vh - 48px)';
          el.classList.add('rounded-none');
          win.isMaximized = true;
        } else {
          el.style.left = `${win.bounds.left}px`;
          el.style.top = `${win.bounds.top}px`;
          el.style.width = `${win.bounds.width}px`;
          el.style.height = `${win.bounds.height}px`;
          el.classList.remove('rounded-none');
          win.isMaximized = false;
        }
      },

      minimize(id) {
        const win = this.windows[id];
        if (!win) return;
        win.element.classList.add('hidden');
        win.isMinimized = true;
        const taskBtn = document.getElementById(`task-btn-${id}`);
        if (taskBtn) taskBtn.classList.remove('bg-white/20');
      },

      restore(id) {
        const win = this.windows[id];
        if (!win) return;
        win.element.classList.remove('hidden');
        win.isMinimized = false;
        this.focus(id);
      },

      toggleWindowState(id) {
        const win = this.windows[id];
        if (!win) return;
        if (win.isMinimized) {
          this.restore(id);
        } else if (this.activeWindowId === id) {
          this.minimize(id);
        } else {
          this.focus(id);
        }
      },

      close(id) {
        const win = this.windows[id];
        if (!win) return;
        win.element.remove();
        delete this.windows[id];
        const taskBtn = document.getElementById(`task-btn-${id}`);
        if (taskBtn) taskBtn.remove();
        SoundEngine.click();
      },

      minimizeAll() {
        Object.keys(this.windows).forEach(id => this.minimize(id));
      },

      addTaskbarItem(win) {
        const container = document.getElementById('taskbar-apps');
        const btn = document.createElement('button');
        btn.id = `task-btn-${win.id}`;
        btn.className = 'taskbar-app-item flex items-center space-x-1.5 px-3 h-9 rounded-lg hover:bg-white/10 border border-white/5 transition text-xs text-white';
        btn.innerHTML = `
          <i data-lucide="${win.icon}" class="w-4 h-4 text-indigo-400"></i>
          <span class="max-w-[100px] truncate hidden sm:inline">${win.title}</span>
        `;
        btn.onclick = () => this.toggleWindowState(win.id);
        container.appendChild(btn);
        lucide.createIcons();
      }
    };
  </script>

  <script>
    /**

     */

          launch: (params) => DriveExplorer.open(params)
        },

    /* 1. DRIVE EXPLORER APP */
    const DriveExplorer = {
      currentPathId: 'root',
      pathHistory: ['root'],
      historyIndex: 0,
      breadcrumbs: [{ id: 'root', name: 'My Drive' }],

      open() {
        WindowManager.create({
          id: 'explorer',
          title: 'Google Drive Explorer',
          icon: 'folder',
          width: 760,
          height: 490,
          contentHtml: `
            <!-- Explorer Navigation Bar -->
            <div class="h-12 bg-white/5 border-b border-white/10 flex items-center justify-between px-3 text-xs gap-2">
              <div class="flex items-center space-x-1">
                <button onclick="DriveExplorer.goBack()" class="p-1.5 hover:bg-white/10 rounded-lg text-slate-300" title="Back"><i data-lucide="chevron-left" class="w-4 h-4"></i></button>
                <button onclick="DriveExplorer.goForward()" class="p-1.5 hover:bg-white/10 rounded-lg text-slate-300" title="Forward"><i data-lucide="chevron-right" class="w-4 h-4"></i></button>
                <button onclick="DriveExplorer.refresh()" class="p-1.5 hover:bg-white/10 rounded-lg text-slate-300" title="Refresh"><i data-lucide="refresh-cw" class="w-4 h-4"></i></button>
              </div>

              <!-- Breadcrumb bar -->
              <div id="explorer-breadcrumbs" class="flex-1 flex items-center space-x-1.5 bg-black/40 px-3 py-1.5 rounded-xl border border-white/10 overflow-x-auto text-slate-300">
                <span class="font-medium text-white flex items-center space-x-1"><i data-lucide="cloud" class="w-3.5 h-3.5 text-indigo-400"></i><span>My Drive</span></span>
              </div>

              <!-- Action buttons -->

      async refresh() {

        lucide.createIcons();

        const items = await DriveStorage.listFiles(this.currentPathId);
        container.innerHTML = '';

        if (countEl) countEl.textContent = `${items.length} item${items.length === 1 ? '' : 's'}`;

        if (items.length === 0) {
          container.innerHTML = `
            <div class="col-span-full py-16 flex flex-col items-center justify-center text-slate-400">
              <i data-lucide="folder-open" class="w-10 h-10 text-slate-500 mb-2"></i>

            iconColor = 'text-amber-400 fill-amber-400/20';

            icon = 'image';
            iconColor = 'text-emerald-400';
          } else if (item.type.includes('json') || item.type.includes('javascript')) {
            icon = 'file-code';
            iconColor = 'text-yellow-400';

          card.innerHTML = `
            <div class="w-12 h-12 flex items-center justify-center rounded-xl bg-white/5 group-hover:scale-105 transition mb-2">

          `;

          card.ondblclick = () => {
            if (item.type === 'folder') {
              DriveExplorer.navigateTo(item.id, item.name);
            } else if (item.type.includes('image')) {
              AppManager.launch('media', { src: item.url || 'https://placehold.co/600x400/312e81/ffffff?text=' + encodeURIComponent(item.name), title: item.name });
            } else {
              AppManager.launch('notepad', { fileId: item.id, fileName: item.name });
            }
          };

          container.appendChild(card);
        });

      },

      navigateTo(folderId, folderName) {
        this.currentPathId = folderId;
        this.breadcrumbs.push({ id: folderId, name: folderName });
        this.renderBreadcrumbs();
        this.refresh();
      },

      renderBreadcrumbs() {
        const bc = document.getElementById('explorer-breadcrumbs');
        if (!bc) return;
        bc.innerHTML = this.breadcrumbs.map((b, idx) => `
          <button onclick="DriveExplorer.sliceBreadcrumbs(${idx})" class="hover:text-white font-medium flex items-center space-x-1">
            <span>${b.name}</span>
            ${idx < this.breadcrumbs.length - 1 ? '<i data-lucide="chevron-right" class="w-3.5 h-3.5 text-slate-500"></i>' : ''}
          </button>
        `).join('');
        lucide.createIcons();
      },

      sliceBreadcrumbs(index) {
        this.breadcrumbs = this.breadcrumbs.slice(0, index + 1);
        const target = this.breadcrumbs[this.breadcrumbs.length - 1];
        this.currentPathId = target.id;
        this.renderBreadcrumbs();
        this.refresh();
      },

      goBack() {
        if (this.breadcrumbs.length > 1) {
          this.breadcrumbs.pop();
          const prev = this.breadcrumbs[this.breadcrumbs.length - 1];
          this.currentPathId = prev.id;
          this.renderBreadcrumbs();
          this.refresh();
        }
      },

      goForward() {
        // Simple forward placeholder
        this.refresh();
      },

      filterType(type) {

      handleKey(e) {
        if (e.key === 'Enter') {
          const input = e.target;
          const cmd = input.value.trim();
          input.value = '';
          this.executeCommand(cmd);
        }
      },

      async executeCommand(rawCmd) {
        const output = document.getElementById('term-output');
        if (!output) return;

        const promptLine = document.createElement('div');
        promptLine.innerHTML = `<span class="text-indigo-400">user@cloudos:~$</span> <span class="text-white">${rawCmd}</span>`;
        output.appendChild(promptLine);

        const parts = rawCmd.split(' ');
        const action = parts[0].toLowerCase();
        const arg = parts.slice(1).join(' ');

        let res = '';

        switch (action) {
          case 'help':
            res = `Available Commands:
  help               Show this manual
  ls                 List items in active Drive directory
  cat <file>         Print file contents from Cloud Storage
  mkdir <dir>        Create folder on Google Drive
  touch <file>       Create empty cloud document
  rm <file>          Remove item
  neofetch           System banner & specifications
  drive-sync         Force refresh Drive index
  whoami             Show logged-in user profile
  date               Print current timestamp
  clear              Clear terminal screen`;
            break;

          case 'clear':
            output.innerHTML = '';
            return;

          case 'neofetch':
            res = `
       /\\         OS: CloudOS 2026.09 (GitHub Pages Web Desktop)
      /  \\        Storage: ${DriveStorage.mode === 'gdrive' ? 'Google Drive REST API v3' : 'Virtual In-Memory Storage'}
     /\\   \\       Client: Google Identity Services (GIS)
    /      \\      Kernel: WebAssembly / Vanilla JS Runtime
   /   ,,   \\     Browser: ${navigator.userAgent.slice(0, 32)}...
  /   |  |  -\\    RAM: Virtual Ephemeral (Zero persistent local disk)
`;
            break;

          case 'ls':
            const items = await DriveStorage.listFiles(DriveExplorer.currentPathId);
            res = items.map(i => `${i.type === 'folder' ? '📁 [DIR]' : '📄 [FILE]'}  ${i.name.padEnd(24)} ${i.size}`).join('\n') || 'Directory empty.';
            break;

          case 'cat':
            if (!arg) {
              res = 'Usage: cat <filename>';
            } else {
              const fileList = await DriveStorage.listFiles(DriveExplorer.currentPathId);
              const found = fileList.find(f => f.name.toLowerCase() === arg.toLowerCase());
              if (found) {
                res = await DriveStorage.readFile(found.id);
              } else {
                res = `cat: ${arg}: File not found in current folder`;
              }
            }
            break;

          case 'mkdir':
            if (!arg) {
              res = 'Usage: mkdir <folder_name>';
            } else {
              await DriveStorage.createFolder(arg, DriveExplorer.currentPathId);
              res = `Directory created on Drive: ${arg}`;
            }
            break;

          case 'touch':
            if (!arg) {
              res = 'Usage: touch <filename>';
            } else {
              await DriveStorage.writeFile(arg, '', null, DriveExplorer.currentPathId);
              res = `Created file on Drive: ${arg}`;
            }
            break;

          case 'whoami':
            res = DriveStorage.userProfile ? `${DriveStorage.userProfile.name} (${DriveStorage.userProfile.email})` : 'guest@cloudos-virtual';
            break;

          case 'date':
            res = new Date().toUTCString();
            break;

          case 'drive-sync':
            DriveStorage.syncRefresh();
            res = 'Drive sync signal sent.';
            break;

          case '':
            break;

          default:
            res = `command not found: ${action}. Type 'help' for command list.`;
        }

        if (res) {
          const respLine = document.createElement('pre');
          respLine.className = 'text-slate-300 font-mono text-xs whitespace-pre-wrap';
          respLine.textContent = res;
          output.appendChild(respLine);
        }

        output.scrollTop = output.scrollHeight;
      }
    };

                <div id="task-manager-list" class="flex-1 overflow-y-auto divide-y divide-white/5 p-1">
                  <!-- Task processes list injected here -->
                </div>
              </div>
            </div>
          `,
          onInit: () => {
            TaskManagerApp.renderList();
            TaskManagerApp.startTicker();
          }
        });
      },

      renderList() {
        const container = document.getElementById('task-manager-list');
        if (!container) return;
        container.innerHTML = '';

        Object.keys(WindowManager.windows).forEach(winId => {
          const win = WindowManager.windows[winId];
          const row = document.createElement('div');
          row.className = 'flex items-center justify-between p-2 hover:bg-white/5 text-slate-200';
          row.innerHTML = `
            <div class="flex items-center space-x-2">
              <i data-lucide="${win.icon}" class="w-4 h-4 text-indigo-400"></i>
              <span>${win.title}</span>
            </div>
            <button onclick="WindowManager.close('${winId}'); TaskManagerApp.renderList();" class="px-2 py-1 bg-red-500/20 hover:bg-red-500/40 text-red-300 rounded text-[11px] transition">End Task</button>
          `;
          container.appendChild(row);
        });
        lucide.createIcons();
      },

      startTicker() {
        const interval = setInterval(() => {
          const cpuVal = document.getElementById('tm-cpu-val');
          const cpuBar = document.getElementById('tm-cpu-bar');
          if (!cpuVal) {
            clearInterval(interval);
            return;
          }
          const rndCpu = Math.floor(Math.random() * 25) + 8;
          cpuVal.textContent = `${rndCpu}%`;
          cpuBar.style.width = `${rndCpu}%`;
        }, 2000);
      }
    };

    /* 8. SETTINGS APP (Google Drive API Auth & Wallpapers) */
    const SettingsApp = {
      open({ tab = 'drive' } = {}) {
        WindowManager.create({
          id: 'settings',
          title: 'System Settings',
          icon: 'settings',
          width: 660,
          height: 480,
          contentHtml: `
            <div class="h-full flex overflow-hidden">
              <!-- Settings Sidebar -->
              <div class="w-44 bg-white/5 border-r border-white/10 p-3 space-y-1 text-xs">
                <button onclick="SettingsApp.switchTab('drive')" id="set-tab-btn-drive" class="flex items-center space-x-2 w-full px-3 py-2 rounded-xl bg-white/10 text-white text-left transition">
                  <i data-lucide="cloud" class="w-4 h-4 text-indigo-400"></i>
                  <span>Google Drive API</span>
                </button>
                <button onclick="SettingsApp.switchTab('wallpapers')" id="set-tab-btn-wallpapers" class="flex items-center space-x-2 w-full px-3 py-2 rounded-xl hover:bg-white/5 text-slate-300 text-left transition">
                  <i data-lucide="image" class="w-4 h-4 text-purple-400"></i>
                  <span>Wallpapers</span>
                </button>
                <button onclick="SettingsApp.switchTab('about')" id="set-tab-btn-about" class="flex items-center space-x-2 w-full px-3 py-2 rounded-xl hover:bg-white/5 text-slate-300 text-left transition">
                  <i data-lucide="info" class="w-4 h-4 text-emerald-400"></i>
                  <span>About CloudOS</span>
                </button>
              </div>

              <!-- Settings Content Panels -->
              <div class="flex-1 p-5 overflow-y-auto text-xs text-slate-300">
                
                <!-- Google Drive Config Panel -->
                <div id="set-panel-drive" class="space-y-4">
                  <div class="border-b border-white/10 pb-3">
                    <h3 class="text-sm font-semibold text-white">Google Drive Integration</h3>
                    <p class="text-slate-400 mt-0.5">Direct client-side access via Google Identity Services & Drive REST v3 API.</p>
                  </div>

                  <div class="acrylic-card p-3 rounded-xl border border-indigo-500/20 bg-indigo-950/20">
                    <div class="flex items-start space-x-2.5">
                      <i data-lucide="shield-check" class="w-5 h-5 text-indigo-400 flex-shrink-0 mt-0.5"></i>
                      <div class="text-[11px] leading-relaxed">
                        <strong class="text-white">Zero Local Persistence:</strong> Your credentials and file buffers exist strictly in runtime memory for the session. Perfect for deploying as a static website on GitHub Pages!
                      </div>
                    </div>
                  </div>

                  <div class="space-y-3">
                    <div>
                      <label class="block text-slate-300 mb-1 font-medium">Google OAuth Client ID</label>
                      <input type="text" id="cfg-client-id" placeholder="e.g. 123456789-abcdef.apps.googleusercontent.com" class="w-full bg-black/40 border border-white/10 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-indigo-500 font-mono text-xs">
                    </div>
                    <div>
                      <label class="block text-slate-300 mb-1 font-medium">Google API Key</label>
                      <input type="password" id="cfg-api-key" placeholder="e.g. AIzaSyB..." class="w-full bg-black/40 border border-white/10 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-indigo-500 font-mono text-xs">
                    </div>

                    <div class="flex items-center space-x-3 pt-2">
                      <button onclick="SettingsApp.applyDriveAuth()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl font-medium transition shadow-lg flex items-center space-x-2">
                        <i data-lucide="log-in" class="w-4 h-4"></i>
                        <span>Authenticate Drive</span>
                      </button>
                      <button onclick="DriveStorage.disconnectDrive()" class="px-4 py-2 bg-white/10 hover:bg-white/20 text-slate-200 rounded-xl transition">
                        Reset to Virtual RAM Drive
                      </button>
                    </div>
                  </div>

                  <div class="pt-4 border-t border-white/10">
                    <h4 class="font-semibold text-white mb-1.5">How to get free Google API credentials:</h4>
                    <ol class="list-decimal list-inside space-y-1 text-slate-400 text-[11px]">
                      <li>Open <a href="https://console.cloud.google.com/" target="_blank" class="text-indigo-400 underline">Google Cloud Console</a>.</li>
                      <li>Enable the <strong>Google Drive API</strong> in APIs & Services.</li>
                      <li>Configure OAuth Consent Screen and create <strong>OAuth Client ID (Web Application)</strong>.</li>
                      <li>Add your GitHub Pages URL to <em>Authorized JavaScript Origins</em>.</li>
                    </ol>
                  </div>
                </div>

                <!-- Wallpapers Panel -->
                <div id="set-panel-wallpapers" class="space-y-4 hidden">
                  <div class="border-b border-white/10 pb-3">
                    <h3 class="text-sm font-semibold text-white">Desktop Wallpaper</h3>
                    <p class="text-slate-400 mt-0.5">Select a curated backdrop or provide a custom image URL.</p>
                  </div>
                  <div class="grid grid-cols-2 gap-3" id="wallpapers-grid">
                    <!-- Populated by JS -->
                  </div>
                  <div>
                    <label class="block text-slate-300 mb-1 font-medium">Custom Image URL</label>
                    <div class="flex space-x-2">
                      <input type="text" id="cfg-custom-bg" placeholder="https://..." class="flex-1 bg-black/40 border border-white/10 rounded-xl px-3 py-1.5 text-white focus:outline-none focus:border-indigo-500">
                      <button onclick="Desktop.setWallpaper(document.getElementById('cfg-custom-bg').value)" class="px-3 py-1.5 bg-indigo-600 rounded-xl text-white">Apply</button>
                    </div>
                  </div>
                </div>

                <!-- About Panel -->
                <div id="set-panel-about" class="space-y-3 hidden">
                  <div class="border-b border-white/10 pb-3">
                    <h3 class="text-sm font-semibold text-white">About CloudOS / DriveDesktop</h3>
                    <p class="text-slate-400 mt-0.5">A zero-local storage cloud operating system replica.</p>
                  </div>
                  <p class="leading-relaxed">
                    Designed specifically for fast, serverless hosting on <strong>GitHub Pages</strong>. It turns your Google Drive into a graphical workstation anywhere you have a web browser.
                  </p>
                  <div class="acrylic-card p-3 rounded-xl text-[11px] space-y-1">
                    <div><strong>Architecture:</strong> Vanilla JS / Single File HTML / Tailwind CSS</div>
                    <div><strong>Storage Backend:</strong> Google Drive API v3 REST</div>
                    <div><strong>Identity Engine:</strong> GIS (Google Identity Services)</div>
                    <div><strong>Version:</strong> 3.2.0-cloud</div>
                  </div>
                </div>

              </div>
            </div>
          `,
          onInit: () => {
            SettingsApp.initWallpapers();
            if (tab) SettingsApp.switchTab(tab);
          }
        });
      },

      switchTab(tabName) {
        ['drive', 'wallpapers', 'about'].forEach(t => {
          const panel = document.getElementById(`set-panel-${t}`);
          const btn = document.getElementById(`set-tab-btn-${t}`);
          if (panel) panel.classList.toggle('hidden', t !== tabName);
          if (btn) {
            btn.classList.toggle('bg-white/10', t === tabName);
            btn.classList.toggle('text-white', t === tabName);
            btn.classList.toggle('text-slate-300', t !== tabName);
          }
        });
      },

      initWallpapers() {
        const grid = document.getElementById('wallpapers-grid');
        if (!grid) return;
        const presets = [
          { name: 'Aurora Vibrant', url: 'https://images.unsplash.com/photo-1579546929518-9e396f3cc809?q=80&w=2070&auto=format&fit=crop' },
          { name: 'Deep Space', url: 'https://images.unsplash.com/photo-1506703719100-a0f3a48c0f86?q=80&w=2070&auto=format&fit=crop' },
          { name: 'Alpine Peak', url: 'https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?q=80&w=2070&auto=format&fit=crop' },
          { name: 'Minimal Dark', url: 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=2070&auto=format&fit=crop' }
        ];

        grid.innerHTML = presets.map(p => `
          <div onclick="Desktop.setWallpaper('${p.url}')" class="group cursor-pointer rounded-xl overflow-hidden border border-white/10 hover:border-indigo-400 transition relative h-24">
            <img src="${p.url}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300">
            <span class="absolute bottom-1 left-2 text-[10px] font-medium bg-black/60 px-1.5 py-0.5 rounded text-white">${p.name}</span>
          </div>
        `).join('');
      },

      applyDriveAuth() {
        const cid = document.getElementById('cfg-client-id').value.trim();
        const akey = document.getElementById('cfg-api-key').value.trim();
        DriveStorage.initGoogleDriveAuth(cid, akey);
      }
    };
  </script>

  <script>
    /**
     * Desktop Environment Manager: Controls desktop icons, start menu toggles,
     * calendar clock popups, wallpapers, and selection rects.
     */
    const Desktop = {
      isStartOpen: false,

      init() {
        this.renderDesktopIcons();
        this.renderStartApps();
        this.startClock();
        this.setupMarqueeSelection();
        DriveStorage.init();
        CalendarView.init();

        // Close dropdowns on outside desktop click
        document.addEventListener('click', (e) => {
          if (!e.target.closest('#start-menu') && !e.target.closest('#start-btn')) {
            this.closeStartMenu();
          }
          if (!e.target.closest('#context-menu')) {
            this.closeContextMenu();
          }
          if (!e.target.closest('#calendar-popover') && !e.target.closest('#tray-clock')) {
            document.getElementById('calendar-popover').classList.add('hidden');
          }
          if (!e.target.closest('#tray-volume-popover') && !e.target.closest('[title="Volume Controls"]')) {
            document.getElementById('tray-volume-popover').classList.add('hidden');
          }
        });
      },

      renderDesktopIcons() {
        const container = document.getElementById('desktop-icons-container');
        const shortcuts = [
          { appId: 'explorer', name: 'Google Drive', icon: 'hard-drive', color: 'text-indigo-400' },
          { appId: 'notepad', name: 'Cloud Editor', icon: 'file-text', color: 'text-blue-400' },
          { appId: 'terminal', name: 'Cloud Terminal', icon: 'terminal', color: 'text-emerald-400' },
          { appId: 'browser', name: 'Web Browser', icon: 'globe', color: 'text-cyan-400' },
          { appId: 'calculator', name: 'Calculator', icon: 'calculator', color: 'text-amber-400' },
          { appId: 'media', name: 'Media Player', icon: 'play-square', color: 'text-rose-400' },
          { appId: 'taskmgr', name: 'Task Manager', icon: 'activity', color: 'text-green-400' },
          { appId: 'settings', name: 'Settings', icon: 'settings', color: 'text-slate-300' }
        ];

        container.innerHTML = shortcuts.map(s => `
          <div ondblclick="AppManager.launch('${s.appId}')" onclick="SoundEngine.click()" class="desktop-icon-node group flex flex-col items-center justify-center p-2 rounded-xl hover:bg-white/15 active:bg-white/20 transition cursor-pointer w-20 text-center select-none">
            <div class="w-12 h-12 rounded-2xl bg-white/10 group-hover:bg-white/20 flex items-center justify-center mb-1.5 shadow-lg backdrop-blur-md border border-white/15 group-hover:scale-105 transition">
              <i data-lucide="${s.icon}" class="w-6 h-6 ${s.color}"></i>
            </div>
            <span class="text-[11px] font-medium text-white drop-shadow leading-tight truncate w-full">${s.name}</span>
          </div>
        `).join('');
        lucide.createIcons();
      },

      renderStartApps(filter = '') {
        const container = document.getElementById('start-apps-grid');
        if (!container) return;

        const apps = Object.entries(AppManager.apps)
          .filter(([k, v]) => v.title.toLowerCase().includes(filter.toLowerCase()) || v.category.toLowerCase().includes(filter.toLowerCase()));

        container.innerHTML = apps.map(([id, app]) => `
          <button onclick="AppManager.launch('${id}')" class="flex flex-col items-center p-2.5 rounded-xl hover:bg-white/10 active:bg-white/20 transition group text-center">
            <div class="w-10 h-10 rounded-xl bg-white/10 flex items-center justify-center mb-1 group-hover:scale-110 transition border border-white/10">
              <i data-lucide="${app.icon}" class="w-5 h-5 text-indigo-400"></i>
            </div>
            <span class="text-[10px] text-slate-200 font-medium truncate w-full">${app.title}</span>
          </button>
        `).join('');
        lucide.createIcons();
      },

      filterStartApps(term) {
        this.renderStartApps(term);
      },

      toggleStartMenu(forceOpenSearch = false) {
        this.isStartOpen = !this.isStartOpen;
        const menu = document.getElementById('start-menu');
        menu.classList.toggle('hidden', !this.isStartOpen);
        SoundEngine.click();

        if (this.isStartOpen && forceOpenSearch) {
          const input = document.getElementById('start-search-input');
          if (input) input.focus();
        }
      },

      closeStartMenu() {
        this.isStartOpen = false;
        document.getElementById('start-menu').classList.add('hidden');
      },

      openContextMenu(e) {
        const menu = document.getElementById('context-menu');
        menu.style.left = `${Math.min(e.clientX, window.innerWidth - 220)}px`;
        menu.style.top = `${Math.min(e.clientY, window.innerHeight - 200)}px`;
        menu.classList.remove('hidden');
        SoundEngine.click();
      },

      closeContextMenu() {
        document.getElementById('context-menu').classList.add('hidden');
      },

      toggleCalendar() {
        const cal = document.getElementById('calendar-popover');
        cal.classList.toggle('hidden');
        SoundEngine.click();
      },

      toggleTrayVolume() {
        const vol = document.getElementById('tray-volume-popover');
        vol.classList.toggle('hidden');
        SoundEngine.click();
      },

      setWallpaper(url) {
        if (!url) return;
        document.getElementById('desktop-wallpaper').style.backgroundImage = `url('${url}')`;
        Notifications.show('Wallpaper Updated', 'Desktop background changed.', 'success');
      },

      startClock() {
        const clockEl = document.getElementById('tray-clock');
        const dateEl = document.getElementById('tray-date');

        const tick = () => {
          const now = new Date();
          clockEl.textContent = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
          dateEl.textContent = now.toISOString().split('T')[0];
        };
        tick();
        setInterval(tick, 1000);
      },

      openSessionControl() {
        SystemDialog.show({
          title: 'Session Management',
          message: 'CloudOS operates completely in runtime memory. Refreshing or closing this tab completely purges active credentials and RAM files.',
          icon: 'power',
          onConfirm: () => {
            location.reload();
          }
        });
      },

      setupMarqueeSelection() {
        const desktop = document.getElementById('desktop-area');
        const box = document.getElementById('selection-box');
        let startX, startY, isSelecting = false;

        desktop.addEventListener('mousedown', (e) => {
          if (e.target !== desktop && e.target !== document.getElementById('desktop-icons-container')) return;
          isSelecting = true;
          startX = e.clientX;
          startY = e.clientY;
          box.style.left = `${startX}px`;
          box.style.top = `${startY}px`;
          box.style.width = '0px';
          box.style.height = '0px';
          box.classList.remove('hidden');
        });

        window.addEventListener('mousemove', (e) => {
          if (!isSelecting) return;
          const currentX = e.clientX;
          const currentY = e.clientY;
          const width = Math.abs(currentX - startX);
          const height = Math.abs(currentY - startY);
          const left = Math.min(currentX, startX);
          const top = Math.min(currentY, startY);

          box.style.width = `${width}px`;
          box.style.height = `${height}px`;
          box.style.left = `${left}px`;
          box.style.top = `${top}px`;
        });

        window.addEventListener('mouseup', () => {
          if (isSelecting) {
            isSelecting = false;
            box.classList.add('hidden');
          }
        });
      }
    };

    /* Interactive Tray Calendar */
    const CalendarView = {
      currDate: new Date(),
      init() {
        this.render();
      },
      render() {
        const grid = document.getElementById('cal-grid');
        const monthYear = document.getElementById('cal-month-year');
        if (!grid) return;

        const year = this.currDate.getFullYear();
        const month = this.currDate.getMonth();
        monthYear.textContent = this.currDate.toLocaleDateString([], { month: 'long', year: 'numeric' });

        const firstDay = new Date(year, month, 1).getDay();
        const totalDays = new Date(year, month + 1, 0).getDate();
        const today = new Date();

        grid.innerHTML = '';

        for (let i = 0; i < firstDay; i++) {
          grid.innerHTML += `<span></span>`;
        }

        for (let day = 1; day <= totalDays; day++) {
          const isToday = today.getFullYear() === year && today.getMonth() === month && today.getDate() === day;
          grid.innerHTML += `
            <span class="py-1 rounded-lg ${isToday ? 'bg-indigo-600 text-white font-bold shadow' : 'text-slate-300 hover:bg-white/10'}">${day}</span>
          `;
        }
      },
      prevMonth() {
        this.currDate.setMonth(this.currDate.getMonth() - 1);
        this.render();
      },
      nextMonth() {
        this.currDate.setMonth(this.currDate.getMonth() + 1);
        this.render();
      }
    };

    // System Startup Execution
    window.addEventListener('DOMContentLoaded', () => {
      Desktop.init();
      // Welcome Notification
      setTimeout(() => {
        Notifications.show('CloudOS Ready', 'Virtual Cloud Drive is running. Open Settings to connect Google Drive.', 'info');
      }, 600);
    });
  </script>
</body>
</html>
